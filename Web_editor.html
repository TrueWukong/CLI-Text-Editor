<!DOCTYPE html>
<html>
<head>
  <title>Mini Text Editor</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    textarea { width: 100%; height: 200px; }
    button { margin: 5px; }
  </style>
</head>
<body>

<h2>Mini Text Editor (Web Demo)</h2>

<textarea id="editor"></textarea><br>

<button onclick="insertLine()">Insert Line</button>
<button onclick="deleteLine()">Delete Line</button>
<button onclick="findReplace()">Find & Replace</button>
<button onclick="undo()">Undo</button>
<button onclick="redo()">Redo</button>
<button onclick="saveFile()">Save</button>
<input type="file" onchange="openFile(event)">

<script>
let undoStack = [];
let redoStack = [];

// Save current state
function saveState() {
  undoStack.push(editor.value);
  redoStack = [];
}

// Insert line
function insertLine() {
  saveState();
  let line = prompt("Enter line text:");
  editor.value += "\n" + line;
}

// Delete last line
function deleteLine() {
  saveState();
  let lines = editor.value.split("\n");
  lines.pop();
  editor.value = lines.join("\n");
}

// Find and replace
function findReplace() {
  saveState();
  let find = prompt("Find:");
  let replace = prompt("Replace with:");
  editor.value = editor.value.replace(find, replace);
}

// Undo
function undo() {
  if (undoStack.length === 0) return;
  redoStack.push(editor.value);
  editor.value = undoStack.pop();
}

// Redo
function redo() {
  if (redoStack.length === 0) return;
  undoStack.push(editor.value);
  editor.value = redoStack.pop();
}

// Save file
function saveFile() {
  let blob = new Blob([editor.value], { type: "text/plain" });
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "text.txt";
  a.click();
}

// Open file
function openFile(event) {
  let file = event.target.files[0];
  let reader = new FileReader();
  reader.onload = () => editor.value = reader.result;
  reader.readAsText(file);
}
</script>

</body>
</html>
